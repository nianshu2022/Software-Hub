# Cloudflare Pages 部署配置
# 适用于纯前端部署

# 构建配置
build:
  command: "cd client && npm ci && npm run build"
  output_directory: "client/dist"
  node_version: "18"

# 环境变量（在Cloudflare Pages控制台设置）
# VITE_API_BASE_URL=https://your-api-domain.com
# VITE_APP_TITLE=Software Hub

# 重定向规则（支持SPA路由）
redirects:
  - source: "/*"
    destination: "/index.html"
    status_code: 200

# 缓存配置
headers:
  - source: "/assets/*"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"
  - source: "/*.js"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"
  - source: "/*.css"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"
